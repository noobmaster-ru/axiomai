services:
  proxy:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_ARTICLES_DATA_SOURCE: ${VITE_ARTICLES_DATA_SOURCE:-http}
        VITE_API_TELEGRAM_ID: ${VITE_API_TELEGRAM_ID:-0}
    depends_on:
      api:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-ops@example.com}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
      - app

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ".env.prod"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped
    command: "python -m axiomai.api"
    volumes:
      - ./assets:/app/assets:ro
      - ./sunny-might-477012-c4-04c66c69a92f.json:/app/sunny-might-477012-c4-04c66c69a92f.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/articles?telegram_id=0', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app

  tgbot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ".env.prod"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: "python -m axiomai.tgbot"
    volumes:
      - ./assets:/app/assets:ro
      - ./sunny-might-477012-c4-04c66c69a92f.json:/app/sunny-might-477012-c4-04c66c69a92f.json:ro
    networks:
      - app

  observer:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ".env.prod"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: "python -m axiomai.observer"
    volumes:
      - ./sunny-might-477012-c4-04c66c69a92f.json:/app/sunny-might-477012-c4-04c66c69a92f.json:ro
    networks:
      - app

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ".env.prod"
    depends_on:
      postgres:
        condition: service_healthy
    command: "alembic upgrade head"
    restart: "no"
    networks:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 30s
      retries: 5
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep '^PONG$' || exit 1" ]
      interval: 10s
      timeout: 30s
      retries: 5
    restart: unless-stopped
    command:
      sh -c '
      redis-server
      --appendonly yes
      --requirepass $$REDIS_PASSWORD
      --bind 0.0.0.0'
    volumes:
      - redis-data:/data
    networks:
      - app

volumes:
  caddy-config:
  caddy-data:
  postgres-data:
  redis-data:

networks:
  edge:
  app:
    internal: true
