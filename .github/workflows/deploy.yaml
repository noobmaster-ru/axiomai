name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ${{ secrets.PROD_PATH }}
            git fetch origin main
            # -f и reset вместо pull: локальные правки на сервере отбрасываются в пользу origin/main
            git checkout -f main
            git reset --hard origin/main
            docker compose -f docker-compose.server.yaml -f docker-compose.grafana.yaml up -d --build
            docker image prune -f
