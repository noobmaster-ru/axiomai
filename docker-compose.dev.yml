services:
  proxy:
    image: caddy:2.10-alpine
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped
    volumes:
      - ./deploy/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    networks:
      - dev

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    env_file:
      - ".env.dev"
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - .:/app
      - frontend-node-modules:/app/frontend/node_modules
    networks:
      - dev

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ".env.dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uvicorn axiomai.api.__main__:create_app --factory --host 0.0.0.0 --port 8000 --reload --reload-dir /app/axiomai
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/articles?telegram_id=0', timeout=5)",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    volumes:
      - .:/app
      - python-venv:/app/.venv
    networks:
      - dev

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ".env.dev"
    depends_on:
      postgres:
        condition: service_healthy
    command: "alembic upgrade head"
    restart: "no"
    volumes:
      - .:/app
      - python-venv:/app/.venv
    networks:
      - dev

  tgbot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ".env.dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: "python -m axiomai.tgbot"
    profiles:
      - workers
    restart: unless-stopped
    volumes:
      - .:/app
      - python-venv:/app/.venv
    networks:
      - dev

  observer:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ".env.dev"
    depends_on:
      postgres:
        condition: service_healthy
    command: "python -m axiomai.observer"
    profiles:
      - workers
    restart: unless-stopped
    volumes:
      - .:/app
      - python-venv:/app/.venv
    networks:
      - dev

  postgres:
    image: postgres:16-alpine
    env_file:
      - ".env.dev"
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 30s
      retries: 5
    restart: unless-stopped
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - dev

  redis:
    image: redis:7-alpine
    env_file:
      - ".env.dev"
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep '^PONG$' || exit 1" ]
      interval: 10s
      timeout: 30s
      retries: 5
    restart: unless-stopped
    command:
      sh -c '
      redis-server
      --appendonly yes
      --requirepass $$REDIS_PASSWORD
      --bind 0.0.0.0'
    volumes:
      - redis-dev-data:/data
    networks:
      - dev

volumes:
  frontend-node-modules:
  postgres-dev-data:
  python-venv:
  redis-dev-data:

networks:
  dev:
